<footer id="footer" class="hidden md:block footer footer-center bg-primary text-primary-content px-4 border-t border-primary/30">
    <div class="flex flex-col sm:flex-row items-center justify-between w-full max-w-6xl mx-auto gap-3">

        <div class="text-xs md:text-sm opacity-90 font-medium tracking-wide">
            © Corporativo UNE {% now 'Y' %} · Todos los derechos reservados.
        </div>

        <!-- Logos de empresas -->
        <div class="flex flex-wrap justify-center sm:justify-end items-center gap-5 sm:gap-6">
            {% for empresa in empresas %}
                {% if empresa.logo %}
                    <img src="{{ empresa.logo.url }}"
                         alt="{{ empresa.nombre }}"
                         class="size-6 brightness-0 invert opacity-90 hover:opacity-100 transition-opacity">
                {% endif %}
            {% endfor %}
        </div>

    </div>
</footer>

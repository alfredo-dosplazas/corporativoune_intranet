<div class="breadcrumb hidden md:flex bg-base-100 border-b border-base-200 px-4 py-1.5 text-xs min-h-10 h-10 items-center">
    <div class="breadcrumbs text-sm">
        <ul>
            {% for breadcrumb in breadcrumbs %}
                <li>
                    {% if breadcrumb.url %}
                        <a class="link" href="{{ breadcrumb.url }}{% querystring %}">{{ breadcrumb.title }}</a>
                    {% else %}
                        {{ breadcrumb.title }}
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    </div>
</div>

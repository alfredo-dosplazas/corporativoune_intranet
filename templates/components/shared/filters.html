{% load crispy_forms_tags %}

<div class="drawer drawer-end z-[150]">
    <input id="filters-drawer" type="checkbox" class="drawer-toggle"/>

    <div class="drawer-side">
        <label for="filters-drawer" aria-label="close sidebar" class="drawer-overlay"></label>

        <div class="w-80 sm:w-96 bg-base-100 min-h-full flex flex-col shadow-2xl border-l border-base-200">

            <!-- HEADER -->
            <div class="p-4 border-b border-base-200 flex items-center justify-between bg-base-200/50">
                <div class="flex items-center gap-2">
                    <span class="icon-[mdi--tune] text-primary text-lg"></span>
                    <h3 class="font-bold text-base">Filtros Avanzados</h3>
                </div>
                <label for="filters-drawer" class="btn btn-sm btn-circle btn-ghost text-base-content/70">✕</label>
            </div>

            <!-- CONTENIDO SCROLLABLE CON CAMPOS CRISPY -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                {% if filter %}
                    <!-- Renderiza solo los inputs sin la etiqueta <form> alrededor -->
                    {% crispy filter.form %}
                {% endif %}
            </div>

            <!-- FOOTER CON ACCIONES -->
            <div class="p-4 border-t border-base-200 bg-base-200/30 flex items-center justify-between gap-2">
                <!-- Mantiene el parámetro 'q' de la Omnibar al hacer reset básico -->
                <a href="?vista={{ vista|default:'tarjetas' }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
                   class="btn btn-sm btn-ghost text-xs">
                    Limpiar Filtros
                </a>

                <button type="submit"
                        form="omnibar-form"
                        onclick="syncDrawerInputs(); document.getElementById('filters-drawer').checked = false;"
                        class="btn btn-sm btn-primary gap-1 px-4">
                    <span class="icon-[mdi--magnify] size-4"></span>
                    Aplicar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- SCRIPT DE VINCULACIÓN AUTOMÁTICA -->
<script>
    function syncDrawerInputs() {
        // Asigna dinámicamente el atributo form="omnibar-form" a todos los inputs, selects y textareas
        // que estén dentro del drawer justo antes de enviar
        const drawer = document.querySelector('.drawer-side');
        if (drawer) {
            const inputs = drawer.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                input.setAttribute('form', 'omnibar-form');
            });
        }
    }

    // Ejecutar también al cargar la página para soportar submit vía Enter dentro de un select/input del drawer
    document.addEventListener('DOMContentLoaded', syncDrawerInputs);
</script>

<c-layouts.base :page_title="page_title" :breadcrumbs="breadcrumbs">

    <!-- HEADER UNIFICADO DE LA APP (Navbar + Breadcrumbs / Control Panel) -->
    <header class="bg-base-100 border-b border-base-200 shrink-0 z-30 shadow-2xs">
        <c-shared.navbar/>

        <!-- Breadcrumbs estándar (siempre visibles si existen) -->
        {% if breadcrumbs %}
            <c-shared.breadcrumbs :breadcrumbs="breadcrumbs" class="w-full" />
        {% endif %}

        <!-- Header Slot (Barra de Control inyectada por la vista) -->
        {% if header %}
            <div class="header-control-panel px-3 md:px-4 py-1.5 border-t border-base-200 bg-base-100">
                {{ header }}
            </div>
        {% endif %}

        <!-- Notificaciones Flash / Mensajes de Django -->
        {% if messages %}
            <div class="px-3 py-1 bg-base-200/50">
                <c-shared.messages/>
            </div>
        {% endif %}
    </header>

    <!-- ÁREA PRINCIPAL SCROLLABLE (Padding denso ERP) -->
    <main class="flex-1 min-h-0 overflow-y-auto w-full p-2.5 md:p-4 pb-16 md:pb-4 flex flex-col gap-3">
        {{ slot }}
    </main>

    <!-- FOOTER DESKTOP COMPACTO -->
    <footer id="footer" class="shrink-0 hidden md:flex footer footer-center bg-base-100 text-base-content/70 border-t border-base-200 text-xs z-20">
        <c-shared.footer />
    </footer>

    <!-- DOCK MÓVIL FIJO (Safe Area iOS / Android) -->
    {% if mobile_dock_items %}
        <div class="dock md:hidden shrink-0 bg-base-100 border-t border-base-300 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] z-40 pb-[env(safe-area-inset-bottom)]">
            {% for item in mobile_dock_items %}
                <a href="{{ item.url }}" class="{% if item.active %}dock-active text-primary font-bold{% else %}text-base-content/60 hover:text-base-content{% endif %} transition-colors py-1">
                    <span class="{{ item.icon }} size-[1.2em]"></span>
                    <span class="dock-label text-[10px] mt-0.5">{{ item.nombre }}</span>
                </a>
            {% endfor %}
        </div>
    {% endif %}

</c-layouts.base>

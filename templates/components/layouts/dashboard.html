<c-layouts.base>
    <div class="h-screen max-h-screen w-full flex flex-col overflow-hidden bg-base-200 antialiased">

        <!-- Header Fijo -->
        <header class="bg-base-100 shadow-sm shrink-0 z-30">
            <c-shared.navbar/>
            {% if breadcrumbs %}<c-shared.breadcrumbs :breadcrumbs="breadcrumbs"/>{% endif %}
            {% if header %}<div class="header px-4 bg-base-100/60 py-2 shadow">{{ header }}</div>{% endif %}
            {% if messages %}<div class="p-2"><c-shared.messages/></div>{% endif %}
        </header>

        <!-- Main Content (min-h-0 le permite estirarse y dar espacio a sus hijos) -->
        <main class="flex-1 min-h-0 w-full max-w-7xl mx-auto p-4 md:p-6 flex flex-col">
            {{ slot }}
        </main>

        <!-- Footer Fijo abajo -->
        <footer id="footer" class="shrink-0 footer footer-center bg-primary text-primary-content py-2 px-4 border-t border-primary/30 z-20">
            <c-shared.footer />
        </footer>

        <!-- Dock Móvil -->
        <div class="dock md:hidden shrink-0 bg-base-100 border-t border-base-300 shadow-[0_-8px_30px_rgba(0,0,0,0.12)] z-40">
            {% for item in mobile_dock_items %}
                <a href="{{ item.url }}" class="{% if item.active %}dock-active text-primary font-bold{% else %}text-base-content/60 hover:text-base-content{% endif %} transition-colors">
                    <span class="{{ item.icon }} size-[1.3em]"></span>
                    <span class="dock-label text-[11px] mt-0.5">{{ item.nombre }}</span>
                </a>
            {% endfor %}
        </div>

    </div>
</c-layouts.base>

{% load static %}
<c-layouts.app>
    <c-slot name="header">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

            <!-- 1. NAVEGACIÓN Y TÍTULO -->
            <div class="flex items-center gap-3">
                <!-- Botón Volver -->
                <a href="{% url 'compras:ordenes__list' %}"
                   class="btn btn-ghost btn-sm btn-square hover:bg-base-200"
                   title="Volver a la lista">
                    <span class="icon-[tabler--arrow-left] text-lg"></span>
                </a>

                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <span class="icon-[tabler--file-plus] text-primary text-xl hidden sm:inline-block"></span>
                        <h1 class="font-extrabold text-lg md:text-xl leading-none tracking-tight">
                            Nueva Orden de Compra
                        </h1>
                        <span class="badge badge-warning badge-xs sm:badge-sm font-medium">Borrador</span>
                    </div>
                    <p class="text-xs text-base-content/60 mt-0.5">
                        Ingresa los detalles del proveedor y los productos a solicitar
                    </p>
                </div>
            </div>

            <!-- 2. ACCIONES EN DESKTOP (Hidden en pantallas pequeñas) -->
            <div class="hidden sm:flex items-center gap-2">
                <a href="{% url 'compras:ordenes__list' %}" class="btn btn-ghost btn-sm">
                    Cancelar
                </a>
                <button form="orden-form" type="submit" class="btn btn-primary btn-sm gap-1.5 shadow-xs">
                    <span class="icon-[tabler--check] text-base"></span>
                    <span>Guardar Orden</span>
                </button>
            </div>
        </div>
    </c-slot>

    <!-- CONTENEDOR PRINCIPAL DEL FORMULARIO CON LIMITADOR DE ANCHO -->
    <div class="max-w-5xl mx-auto pb-20 sm:pb-6">
        <c-apps.compras.ordenes.form/>
    </div>

    <!-- BARRA FLOTANTE INFERIOR DE ACCIONES (SOLO MOBILE) -->
    <div class="fixed bottom-0 left-0 right-0 py-5 px-3 bg-base-100/95 backdrop-blur-md border-t border-base-300 shadow-[0_-8px_30px_rgba(0,0,0,0.12)] sm:hidden z-50 flex items-center gap-2 justify-between">
        <a href="{% url 'compras:ordenes__list' %}" class="btn btn-ghost btn-sm flex-1">
            Cancelar
        </a>
        <button form="orden-form" type="submit" class="btn btn-primary btn-sm flex-1 gap-1.5 shadow-sm">
            <span class="icon-[tabler--check] text-base"></span>
            <span>Guardar</span>
        </button>
    </div>
</c-layouts.app>

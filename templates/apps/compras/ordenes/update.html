{% load static %}

<c-layouts.app>
    <c-slot name="header">
        <!-- BARRA SUPERIOR ERP: NAVEGACIÓN Y ACCIONES -->
        <div class="flex items-center justify-between gap-2">

            <!-- TÍTULO, BREADCRUMBS Y ESTADO -->
            <div class="flex items-center gap-2 min-w-0">
                <a href="{% url 'compras:ordenes__list' %}"
                   class="btn btn-ghost btn-xs btn-square shrink-0 text-base-content/60 hover:text-base-content"
                   title="Volver a la lista">
                    <span class="icon-[tabler--arrow-left] text-sm"></span>
                </a>

                <div class="flex items-center gap-1.5 text-xs truncate">
                    <span class="font-bold text-base-content truncate" title="{{ orden }}">
                        {{ orden }}
                    </span>
                </div>

                <!-- BADGE DE ESTADO DE LA ÓRDEN -->
                <span class="badge badge-xs text-[10px] font-medium shrink-0 ml-1
                    {% if orden.estado == 'aprobado' %}badge-success
                    {% elif orden.estado == 'pendiente' %}badge-warning
                    {% elif orden.estado == 'cancelado' %}badge-error
                    {% else %}badge-ghost{% endif %}">
                    {{ orden.get_estado_display|default:orden.estado|default:"Editando" }}
                </span>
            </div>

            <!-- BOTONES DE ACCIÓN RÁPIDA -->
            <div class="flex items-center gap-1.5 shrink-0">
                <!-- Botón de Vista Previa PDF -->
                <a href="#"
                   onclick="abrirPDF('{% url 'compras:ordenes__pdf' orden.pk %}'); return false;"
                   class="btn btn-ghost btn-xs border border-base-300 bg-base-100 gap-1 font-normal text-error hover:bg-error/10 hover:border-error/30"
                   title="Ver PDF">
                    <span class="icon-[tabler--file-type-pdf] text-xs"></span>
                    <span class="hidden sm:inline">PDF</span>
                </a>

                <a href="{% url 'compras:ordenes__list' %}"
                   class="btn btn-ghost btn-xs font-normal text-base-content/70">
                    Cancelar
                </a>

                <button form="orden-form"
                        type="submit"
                        class="btn btn-primary btn-xs gap-1 font-medium shadow-2xs">
                    <span class="icon-[tabler--device-floppy] text-xs"></span>
                    <span>Guardar Cambios</span>
                </button>
            </div>

        </div>
    </c-slot>

    <!-- FORMULARIO DE ORDEN DE COMPRA -->
    <c-apps.compras.ordenes.form/>
</c-layouts.app>

<c-layouts.app>
    <div class="max-w-2xl mx-auto py-8 px-4">
        <div class="card bg-base-100 shadow-xl border border-base-300">
            <div class="card-body">
                <h2 class="card-title text-2xl font-black text-primary mb-2">
                    📦 Importar Invitados para: {{ evento.nombre }}
                </h2>
                <p class="text-sm text-base-content/70 mb-4">
                    Sube un archivo de Excel (`.xlsx`) o CSV con los premios de la rifa.
                    El archivo debe contener las columnas: <code class="bg-base-200 px-1 py-0.5 rounded font-mono">nombre_completo</code>.
                </p>

                <form method="POST" enctype="multipart/form-data" class="space-y-6">
                    {% csrf_token %}

                    <div class="form-control w-full">
                        {{ form.archivo.label_tag }}
                        <div class="mt-2">
                            {{ form.archivo }}
                        </div>
                        {% if form.archivo.errors %}
                            <label class="label">
                                <span class="label-text-alt text-error">{{ form.archivo.errors.0 }}</span>
                            </label>
                        {% endif %}
                    </div>

                    <div class="flex justify-end gap-3 pt-4">
                        <a href="{% url 'regalos:invitados__list' evento.slug %}" class="btn btn-ghost">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary shadow-lg">
                            📥 Procesar e Importar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</c-layouts.app>

<c-layouts.base>
    <!-- SCRIPT DE LOTTIE-WEB OFICIAL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <!-- SCRIPT DE HTML5-QRCODE PARA USAR LA CÁMARA -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-base-300 via-base-200 to-base-300 relative overflow-hidden">

        <!-- DECORACIONES DE FONDO -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="card w-full max-w-md bg-base-100/95 backdrop-blur-xl shadow-2xl border border-base-300/80 overflow-hidden relative z-10">
            <div class="card-body text-center p-6 md:p-6">

                <!-- ENCABEZADO -->
                <div class="inline-flex p-3 bg-primary/10 rounded-2xl mb-1 mx-auto text-primary shadow-inner">
                    <span class="text-3xl">🎁</span>
                </div>

                <h1 class="card-title text-2xl font-black justify-center text-transparent bg-clip-text bg-gradient-to-r from-primary via-secondary to-accent">
                    Escáner de Canje
                </h1>
                <p class="text-xs text-base-content/70 font-bold uppercase tracking-wider mt-0.5">
                    Evento: <span class="text-primary font-black">{{ evento.nombre }}</span>
                </p>

                <!-- CONTENEDOR DE CÁMARA Y ESTADOS -->
                <div id="section-escaneo" class="mt-4 space-y-4 text-left">

                    <!-- ALERTA DE MENSAJES DINÁMICOS -->
                    <div id="alerta-error" class="hidden alert alert-error text-xs shadow-md py-2 px-3">
                        <span class="icon-[tabler--alert-triangle] text-base shrink-0"></span>
                        <span id="texto-error">Error en el proceso</span>
                    </div>

                    <!-- LECTOR DE CÁMARA VISIBLE -->
                    <div class="relative bg-neutral rounded-xl overflow-hidden border border-base-300 shadow-inner">
                        <div id="reader" style="width: 100%; min-height: 250px;"></div>
                    </div>

                    <!-- ESTADO ACTUAL DEL PROCESO -->
                    <div id="status-card" class="p-3 rounded-xl bg-base-200/80 border border-base-300 text-center">
                        <div class="badge badge-primary font-bold mb-1" id="badge-paso">PASO 1 DE 2</div>
                        <p id="instrucciones-escaneo" class="text-xs font-bold text-base-content">
                            Apunta la cámara al código QR del <span class="text-primary underline">Invitado</span>.
                        </p>
                        <div id="info-invitado-validado" class="hidden mt-2 text-xs font-bold text-success flex items-center justify-center gap-1">
                            <span class="icon-[tabler--circle-check] text-sm"></span>
                            <span>Invitado: <strong id="lbl-nombre-invitado" class="underline"></strong></span>
                        </div>
                    </div>

                </div>

                <!-- SECCIÓN DE APERTURA Y REVELACIÓN DEL REGALO -->
                <div id="section-revelacion" class="hidden relative min-h-[380px] flex flex-col justify-center items-center my-2">

                    <!-- CONTENEDOR DE LA ANIMACIÓN LOTTIE-WEB -->
                    <div id="gift-box-container"
                         class="cursor-pointer flex flex-col items-center group transition-transform hover:scale-105"
                         onclick="revelarPremioMovil()">

                        <div id="lottie-gift" style="width: 180px; height: 180px;"></div>

                        <div id="click-prompt" class="badge badge-primary badge-lg font-black uppercase tracking-widest px-6 py-3 shadow-lg shadow-primary/20 animate-bounce mt-2">
                            👇 ¡Toca para abrir! 👇
                        </div>
                    </div>

                    <!-- REVELACIÓN DEL PREMIO -->
                    <div id="premio-revealed"
                         class="hidden flex-col items-center justify-center space-y-3 w-full animate-fade-in">
                        <div class="badge badge-success badge-lg text-white font-black tracking-wider px-6 py-3 shadow-lg shadow-success/30 uppercase text-xs">
                            🎉 ¡PREMIO DESBLOQUEADO! 🎉
                        </div>

                        <h2 id="txt-premio-nombre" class="text-2xl font-black text-primary leading-tight mt-1 drop-shadow-sm">
                            -
                        </h2>

                        <div class="bg-base-200/80 py-2 px-6 rounded-full border border-base-300 shadow-sm">
                            <span class="text-xs text-base-content/60 font-bold uppercase tracking-wider">Ganador(a):</span>
                            <strong id="txt-ganador-nombre" class="text-info text-sm ml-1 font-black">-</strong>
                        </div>

                        <div class="badge badge-warning badge-lg font-mono font-black mt-2" id="txt-premio-numero">
                            #000
                        </div>

                        <div class="card-actions justify-center mt-4">
                            <button class="btn btn-primary btn-sm font-bold text-white shadow-md" onclick="location.reload()">Escanear Siguiente Canje 🔄</button>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- SCRIPT DE CÁMARA Y LÓGICA DE ESCANEO -->
    <script>
        let animacionRegalo;
        let html5QrCode;
        let pasoActual = 1; // 1: Escanear Invitado, 2: Escanear Regalo
        let invitadoQrActual = null;

        document.addEventListener("DOMContentLoaded", function () {
            // Inicializar Lottie
            const contenedor = document.getElementById('lottie-gift');
            if (contenedor) {
                animacionRegalo = lottie.loadAnimation({
                    container: contenedor,
                    renderer: 'svg',
                    loop: false,
                    autoplay: false,
                    path: 'https://lottie.host/0f731e26-b070-4897-8746-aa468049e827/FhDrqdRK7d.json'
                });
            }

            // Inicializar Lector de Cámara con html5-qrcode
            html5QrCode = new Html5Qrcode("reader");
            const configQR = { fps: 10, qrbox: { width: 220, height: 220 } };

            // Iniciar escaneo en la cámara trasera por defecto
            html5QrCode.start(
                { facingMode: "environment" },
                configQR,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Error al iniciar la cámara: ", err);
                mostrarError("No se pudo acceder a la cámara. Asegúrate de dar permisos HTTPS.");
            });
        });

        function mostrarError(mensaje) {
            const alerta = document.getElementById('alerta-error');
            const texto = document.getElementById('texto-error');
            texto.textContent = mensaje;
            alerta.classList.remove('hidden');
            setTimeout(() => { alerta.classList.add('hidden'); }, 5000);
        }

        // Esta función se ejecuta cada vez que la cámara lee un código QR con éxito
        function onScanSuccess(decodedText, decodedResult) {
            // Pausamos brevemente el escaneo para evitar lecturas duplicadas en milisegundos
            if (pasoActual === 1) {
                // Procesar Paso 1: Invitado
                pasoActual = 0; // Bloquear temporalmente lecturas
                validarInvitadoQR(decodedText.trim());
            } else if (pasoActual === 2) {
                // Procesar Paso 2: Regalo
                pasoActual = 0; // Bloquear temporalmente lecturas
                enviarCanjeFinal(decodedText.trim());
            }
        }

        function onScanFailure(error) {
            // Se ignora para que siga buscando continuamente sin llenar la consola
        }

        // Validación AJAX del Invitado
        function validarInvitadoQR(codigoQr) {
            const formData = new FormData();
            formData.append('invitado_qr', codigoQr);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch("{% url 'regalos:api_validar_invitado' evento.slug %}", {
                method: 'POST',
                body: formData
            })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(res => {
                if (res.status === 200 && res.body.status === 'success') {
                    invitadoQrActual = codigoQr;
                    pasoActual = 2; // Avanzar al paso 2

                    // Actualizar interfaz visual
                    document.getElementById('badge-paso').textContent = "PASO 2 DE 2";
                    document.getElementById('badge-paso').className = "badge badge-success font-bold mb-1";
                    document.getElementById('instrucciones-escaneo').innerHTML = 'Invitado validado. Ahora apunta al QR del <span class="text-success underline">Regalo</span>.';

                    const lblNombre = document.getElementById('lbl-nombre-invitado');
                    lblNombre.textContent = res.body.nombre_completo;
                    document.getElementById('info-invitado-validado').classList.remove('hidden');
                } else {
                    mostrarError(res.body.message || "Invitado no encontrado.");
                    pasoActual = 1; // Reintentar paso 1
                }
            })
            .catch(err => {
                console.error(err);
                mostrarError("Error de red al validar invitado.");
                pasoActual = 1;
            });
        }

        // Envío final del Canje
        function enviarCanjeFinal(regaloQr) {
            const formData = new FormData();
            formData.append('invitado_qr', invitadoQrActual);
            formData.append('regalo_qr', regaloQr);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch("{% url 'regalos:api_procesar_canje' evento.slug %}", {
                method: 'POST',
                body: formData
            })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(res => {
                if (res.status === 200 && res.body.status === 'success') {
                    // Apagar la cámara de forma segura
                    if (html5QrCode && html5QrCode.isScanning) {
                        html5QrCode.stop().catch(err => console.log(err));
                    }

                    // Mostrar animación de éxito
                    document.getElementById('section-escaneo').classList.add('hidden');

                    document.getElementById('txt-premio-nombre').textContent = res.body.premio;
                    document.getElementById('txt-ganador-nombre').textContent = res.body.ganador;
                    document.getElementById('txt-premio-numero').textContent = "#" + res.body.numero;

                    const secRevelacion = document.getElementById('section-revelacion');
                    secRevelacion.classList.remove('hidden');
                    secRevelacion.classList.add('flex');

                    setTimeout(revelarPremioMovil, 400);
                } else {
                    mostrarError(res.body.message || "Error al procesar canje.");
                    pasoActual = 2; // Permitir reintentar escanear otro regalo si este falló
                }
            })
            .catch(err => {
                console.error(err);
                mostrarError("Error de red al procesar el canje.");
                pasoActual = 2;
            });
        }

        let yaAbierto = false;

        function revelarPremioMovil() {
            if (yaAbierto) return;
            yaAbierto = true;

            const clickPrompt = document.getElementById('click-prompt');
            const boxContainer = document.getElementById('gift-box-container');
            const premio = document.getElementById('premio-revealed');

            if (!boxContainer || !premio) return;
            if (clickPrompt) clickPrompt.style.display = 'none';

            if (animacionRegalo) {
                animacionRegalo.play();
            }

            setTimeout(() => {
                boxContainer.style.transform = "scale(0.8)";
                boxContainer.style.opacity = "0";
                boxContainer.style.transition = "all 0.4s ease-in-out";

                setTimeout(() => {
                    boxContainer.classList.add('hidden');
                    premio.classList.remove('hidden');
                    premio.classList.add('flex');
                }, 300);
            }, 1400);
        }
    </script>
</c-layouts.base>

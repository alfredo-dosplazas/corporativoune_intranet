{% extends "base.html" %}
{% load render_table from django_tables2 %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">{{ page_title }}</h1>
        <a href="{% url 'resguardos:create' %}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nuevo Resguardo
        </a>
    </div>

    <!-- Formulario de Búsqueda -->
    <div class="card mb-3">
        <div class="card-body">
            <form method="get" class="row g-2">
                <div class="col-md-4">
                    <input type="text" name="q" value="{{ request.GET.q }}" class="form-control" placeholder="Buscar por Folio, Equipo, N° Serie, Empleado...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Renderizado de la Tabla django-tables2 -->
    <div class="card">
        <div class="card-body p-0">
            {% render_table table %}
        </div>
    </div>
</div>
{% endblock %}

<c-layouts.base>
    <div id="pantalla-container"
         class="w-screen h-screen bg-black overflow-hidden relative flex items-center justify-center select-none">

        <!-- ELEMENTO IMAGEN -->
        <img id="slide-imagen" src="" alt="Diapositiva"
             class="absolute inset-0 w-full h-full object-contain transition-opacity duration-700 opacity-0 z-10"/>

        <!-- ELEMENTO VIDEO -->
        <video id="slide-video"
               class="absolute inset-0 w-full h-full object-contain transition-opacity duration-700 opacity-0 z-10"
               muted playsinline></video>

        <!-- MENSAJE SI NO HAY ARCHIVOS -->
        <div id="sin-contenido" class="hidden text-center text-white/50 space-y-4">
            <p class="text-6xl animate-pulse">📺</p>
            <p class="text-2xl font-light">Esperando contenido en la carpeta de red...</p>
        </div>
    </div>

    <!-- Renderizamos la playlist de forma segura con json_script -->
    {{ playlist_inicial|json_script:"playlist-data" }}

    <script>
        const pantallaId = "{{ pantalla.id }}";

        let playlist = JSON.parse(document.getElementById('playlist-data').textContent);
        let indiceActual = 0;
        let timerActual = null;
        let reproduciendo = false;
        let safetyTimeout = null; // Temporizador de respaldo anti-congelamiento

        const imgElement = document.getElementById('slide-imagen');
        const videoElement = document.getElementById('slide-video');
        const emptyElement = document.getElementById('sin-contenido');

        function limpiarTimersYMedios() {
            if (timerActual) {
                clearTimeout(timerActual);
                timerActual = null;
            }
            if (safetyTimeout) {
                clearTimeout(safetyTimeout);
                safetyTimeout = null;
            }
            // Limpiamos eventos previos para evitar ejecuciones duplicadas
            videoElement.onended = null;
            videoElement.onerror = null;
            imgElement.onerror = null;

            videoElement.pause();
            videoElement.currentTime = 0;
        }

        function reproducirSiguiente() {
            limpiarTimersYMedios();

            if (!playlist || playlist.length === 0) {
                imgElement.classList.add('opacity-0');
                videoElement.classList.add('opacity-0');
                emptyElement.classList.remove('hidden');
                reproduciendo = false;
                return;
            }

            emptyElement.classList.add('hidden');

            if (indiceActual >= playlist.length) {
                indiceActual = 0;
            }

            const item = playlist[indiceActual];
            console.log(`Reproduciendo [Índice: ${indiceActual}] - Tipo: ${item.tipo} - Archivo: ${item.nombre}`);

            indiceActual++;
            reproduciendo = true;

            if (item.tipo === 'imagen') {
                videoElement.pause();
                videoElement.removeAttribute('src');
                videoElement.load();
                videoElement.classList.add('opacity-0');

                imgElement.onerror = () => {
                    console.warn(`Error cargando imagen (${item.nombre}), saltando al siguiente.`);
                    reproducirSiguiente();
                };

                imgElement.src = item.url;
                imgElement.classList.remove('opacity-0');

                const duracionMs = (item.duracion || 8) * 1000;
                timerActual = setTimeout(() => {
                    reproducirSiguiente();
                }, duracionMs);

            } else if (item.tipo === 'video') {
                imgElement.classList.add('opacity-0');
                imgElement.removeAttribute('src');

                videoElement.onerror = (e) => {
                    console.warn(`Error en el video (${item.nombre}), saltando al siguiente.`, e);
                    reproducirSiguiente();
                };

                // Bandera para evitar doble salto si 'ended' y el 'safety' chocan
                let yaSalto = false;
                const saltarUnico = () => {
                    if (!yaSalto) {
                        yaSalto = true;
                        reproducirSiguiente();
                    }
                };

                videoElement.onended = () => {
                    console.log(`Video finalizado correctamente: ${item.nombre}`);
                    saltarUnico();
                };

                videoElement.src = item.url;
                videoElement.classList.remove('opacity-0');

                const playPromise = videoElement.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.warn("Error reproduciendo video (autoplay policy o codec):", err);
                        saltarUnico();
                    });
                }

                // SEGURIDAD (WATCHDOG): Si el video dura X segundos, le damos un margen extra de 5 segundos.
                // Si por alguna razón el navegador se cuelga y no lanza 'onended', este timer forzará el cambio de slide.
                const duracionEstimadaMs = ((item.duracion && item.duracion > 0 ? item.duracion : 15) + 5) * 1000;
                safetyTimeout = setTimeout(() => {
                    if (!videoElement.paused && videoElement.currentTime > 0) {
                        // Si el video sigue reproduciéndose después del tiempo estimado, dejamos que siga un poco más o forzamos si se trabó
                        return;
                    }
                    console.warn(`Watchdog: El video ${item.nombre} tardó demasiado o se congeló. Forzando siguiente.`);
                    saltarUnico();
                }, Math.max(duracionEstimadaMs, 30000)); // Mínimo 30s de respaldo si no trae duración
            }
        }

        // CONEXIÓN WEBSOCKET PARA ACTUALIZACIONES EN TIEMPO REAL
        function conectarWebSocket() {
            const wsScheme = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const socketUrl = `${wsScheme}${window.location.host}/ws/infopantallas/${pantallaId}/`;
            const socket = new WebSocket(socketUrl);

            socket.onmessage = function (event) {
                const data = JSON.parse(event.data);
                if (data.type === 'ACTUALIZAR_PLAYLIST') {
                    console.log("Nueva playlist recibida por WebSocket:", data.playlist);

                    const estabaVacio = (!playlist || playlist.length === 0);
                    playlist = data.playlist;

                    if (estabaVacio || !reproduciendo) {
                        indiceActual = 0;
                        reproducirSiguiente();
                    }
                }
            };

            socket.onclose = function () {
                setTimeout(conectarWebSocket, 3000);
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (playlist && playlist.length > 0) {
                indiceActual = 0;
                reproducirSiguiente();
            }
            conectarWebSocket();
        });
    </script>
</c-layouts.base>

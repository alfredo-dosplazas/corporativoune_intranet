<c-layouts.app>
    <a href="{% url 'infopantallas:create' %}">Crear</a>

    <ul>
        {% for pantalla in pantalla_list %}
            <li>{{ pantalla }} - <a href="{% url 'infopantallas:update' pantalla.pk %}">Editar</a> <a
                    href="{% url 'infopantallas:show_slides' pantalla.codigo_identificador %}">Ver pantalla</a>
                <form action="{% url 'infopantallas:delete' pantalla.pk %}" method="post">
                    {% csrf_token %}
                    <button>Eliminar</button>
                </form>
            </li>
        {% endfor %}

    </ul>
</c-layouts.app>

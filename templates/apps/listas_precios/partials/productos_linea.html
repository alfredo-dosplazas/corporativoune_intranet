<div class="p-3 bg-base-200/50 rounded-xl space-y-2">
    <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-semibold text-base-content/70">
            Ajustar Precio Base / Lista de los Productos de la línea:
        </p>
        <span class="badge badge-sm badge-ghost font-mono">{{ productos|length }} productos</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 max-h-72 overflow-y-auto pr-1">
        {% for prod in productos %}
            <div class="flex items-center justify-between p-2 bg-base-100 rounded-xl border border-base-200 text-xs shadow-2xs hover:border-primary/40 transition-colors">
                <div class="truncate pr-2 min-w-0">
                    <span class="font-bold text-primary block truncate">{{ prod.CVE_ART }}</span>
                    <span class="truncate block text-base-content/70" title="{{ prod.DESCRIP }}">{{ prod.DESCRIP }}</span>
                </div>

                <div class="flex items-center gap-1 shrink-0">
                    <span class="text-base-content/50 font-bold">$</span>
                    <!-- PRECIO DB PRECARGADO EN VALUE -->
                    <input type="number"
                           step="0.01"
                           name="precio_prod_{{ prod.CVE_ART }}"
                           value="{{ prod.PRECIO_LISTA|stringformat:'.2f'|default:'0.00' }}"
                           class="input input-xs input-bordered w-24 text-right font-mono font-bold focus:input-primary rounded-lg" />
                </div>
            </div>
        {% empty %}
            <p class="text-xs text-error p-2">No se encontraron productos registrados para esta línea.</p>
        {% endfor %}
    </div>
</div>
